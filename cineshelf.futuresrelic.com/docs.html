<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineShelf Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .nav-tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
        }

        .nav-tab {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .nav-tab:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .nav-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .content {
            padding: 2rem;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
        }

        .doc-section {
            display: none;
        }

        .doc-section.active {
            display: block;
        }

        .markdown-content {
            line-height: 1.8;
        }

        .markdown-content h1 {
            font-size: 2rem;
            margin: 2rem 0 1rem;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 1.5rem;
            margin: 1.5rem 0 1rem;
            color: #764ba2;
        }

        .markdown-content h3 {
            font-size: 1.2rem;
            margin: 1rem 0 0.5rem;
            color: #555;
        }

        .markdown-content code {
            background: #f5f5f5;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .markdown-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
            color: #f8f8f2;
        }

        .markdown-content ul, .markdown-content ol {
            margin: 1rem 0 1rem 2rem;
        }

        .markdown-content li {
            margin: 0.5rem 0;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .markdown-content th, .markdown-content td {
            border: 1px solid #ddd;
            padding: 0.75rem;
            text-align: left;
        }

        .markdown-content th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .access-denied {
            text-align: center;
            padding: 4rem 2rem;
        }

        .access-denied h2 {
            color: #ef4444;
            margin-bottom: 1rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .container {
                border-radius: 0;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .nav-tab {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }

            .content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 CineShelf Documentation</h1>
            <p>Complete guides for users, admins, and developers</p>
        </div>

        <div class="nav-tabs" id="navTabs">
            <button class="nav-tab active" onclick="switchTab('user')">👤 User Guide</button>
            <button class="nav-tab" onclick="switchTab('admin')">⚙️ Admin Guide</button>
            <button class="nav-tab" onclick="switchTab('dev')">💻 Developer Guide</button>
            <button class="nav-tab" onclick="switchTab('changelog')">📋 Changelog</button>
        </div>

        <div class="content">
            <a href="/" class="back-link">← Back to CineShelf</a>

            <div id="user" class="doc-section active">
                <div class="loading">Loading User Guide...</div>
            </div>

            <div id="admin" class="doc-section">
                <div class="loading">Loading Admin Guide...</div>
            </div>

            <div id="dev" class="doc-section">
                <div class="loading">Loading Developer Guide...</div>
            </div>

            <div id="changelog" class="doc-section">
                <div class="loading">Loading Changelog...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let currentUser = null;

        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('/api/api.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'get_current_user'})
                });
                const result = await response.json();
                if (result.ok && result.data) {
                    currentUser = result.data;
                }
            } catch (e) {
                console.error('Auth check failed:', e);
            }
        }

        // Fetch markdown document
        async function fetchDoc(name) {
            try {
                const response = await fetch('/api/api.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: 'get_documentation',
                        doc_name: name
                    })
                });
                const result = await response.json();

                if (!result.ok) {
                    throw new Error(result.error || 'Failed to load documentation');
                }

                return result.data.content;
            } catch (error) {
                console.error('Failed to fetch doc:', error);
                return null;
            }
        }

        // Render markdown
        function renderMarkdown(markdown, elementId) {
            const element = document.getElementById(elementId);
            
            if (!markdown) {
                element.innerHTML = `
                    <div class="access-denied">
                        <h2>⛔ Access Denied</h2>
                        <p>You don't have permission to view this document.</p>
                        <p>Admin and Developer guides are restricted to authorized users.</p>
                    </div>
                `;
                return;
            }

            const html = marked.parse(markdown);
            element.innerHTML = `<div class="markdown-content">${html}</div>`;
        }

        // Switch tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content sections
            document.querySelectorAll('.doc-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');

            // Load content if not already loaded
            const section = document.getElementById(tabName);
            if (section.querySelector('.loading')) {
                loadDoc(tabName);
            }
        }

        // Load document
        async function loadDoc(name) {
            const content = await fetchDoc(name);
            renderMarkdown(content, name);
        }

        // Initialize
        async function init() {
            await checkAuth();
            
            // Load user guide by default
            await loadDoc('user');
        }

        init();
    </script>
</body>
</html>
